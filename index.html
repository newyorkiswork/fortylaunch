<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortylaunch | Enterprise AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0F172A', /* Slate 900 - Professional Deep Blue/Black */
                        bgCard: '#1E293B', /* Slate 800 */
                        bgElevated: '#334155', /* Slate 700 */
                        accentCyan: '#38BDF8', /* Sky 400 - "Launch Blue" */
                        accentPurple: '#818CF8', /* Indigo 400 */
                        accentGreen: '#34D399', /* Emerald 400 */
                        border: '#334155', /* Slate 700 */
                        textPrimary: '#F1F5F9', /* Slate 100 */
                        textSecondary: '#94A3B8' /* Slate 400 */
                    },
                    fontFamily: {
                        sans: ['Syne', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 3s ease-in-out infinite',
                        'wave': 'wave 1s ease-in-out infinite',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 20px rgba(56, 189, 248, 0.2)' },
                            '50%': { transform: 'scale(1.05)', boxShadow: '0 0 40px rgba(56, 189, 248, 0.4)' },
                        },
                        'wave': {
                            '0%, 100%': { transform: 'scaleY(1)' },
                            '50%': { transform: 'scaleY(1.5)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0F172A;
            color: #F1F5F9;
            font-family: 'Space Mono', monospace;
        }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38BDF8;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "recharts": "https://esm.sh/recharts@^2.15.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
